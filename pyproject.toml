[project]
name = "browser-automation-project"
version = "0.1.0"
description = "Autonomous LangGraph agent that searches, browses, and extracts structured data from the web"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.136.3",
    "httpx>=0.28.1",
    "langchain>=1.3.2",
    "langchain-groq>=1.1.2",
    "langchain-openai>=1.2.2",
    "langgraph>=1.2.2",
    "mcp>=1.27.2",
    "openai>=2.38.0",
    "playwright>=1.60.0",
    "python-dotenv>=1.2.2",
    "tavily-python>=0.7.25",
    "tenacity>=9.1.4",
    "uvicorn>=0.48.0",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "pytest>=9.0.3",
    "ruff>=0.15.15",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
